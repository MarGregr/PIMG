name: Deploy Frontend (Vue to Azure Web App)

on:
  push:
    branches:
      - main
    paths:
      - 'pi.client/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'pi.client/package-lock.json'

      - name: Install dependencies & Build
        run: |
          npm ci
          npm run build
        working-directory: ./pi.client

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'pimg-frontend' # Podmień na rzeczywistą nazwę App Service w Azure
          package: './pi.client/dist'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}